                    try {
                        const savedData = await loadDataFromDB();
                        if (savedData && Array.isArray(savedData) && savedData.length > 0) {
                            allData = savedData;
                            isDataLoaded = true;
                            applyFiltersAndRender();
                            if (dataSourceBadge) {
                                dataSourceBadge.textContent = '📁 Local (IndexedDB)';
                                dataSourceBadge.style.background = 'rgba(255,193,7,0.2)';
                                dataSourceBadge.style.color = '#ffc107';
                            }
                            updateAdminStats();
                            return;
                        }
                    } catch (e) { /* ignore */ }
                    allData = [];
                    isDataLoaded = false;
                    applyFiltersAndRender();
                    if (dataSourceBadge) {
                        dataSourceBadge.textContent = '⚠️ No data';
                        dataSourceBadge.style.background = 'rgba(220,53,69,0.2)';
                        dataSourceBadge.style.color = '#dc3545';
                    }
                    return;
                }

                try {
                    if (loadingOverlay) loadingOverlay.classList.add('active');
                    if (dataSourceBadge) {
                        dataSourceBadge.textContent = '⏳ Loading…';
                        dataSourceBadge.style.background = 'rgba(59,158,255,0.2)';
                        dataSourceBadge.style.color = '#8abfff';
                    }

                    // Get current batch ID
                    const { data: batchData, error: batchError } = await supabaseClient
                        .from('app_state')
                        .select('value')
                        .eq('key', 'current_batch_id')
                        .maybeSingle();

                    if (batchError) throw batchError;

                    let batchId = batchData ? batchData.value : null;

                    if (!batchId) {
                        allData = [];
                        isDataLoaded = false;
                        currentBatchId = null;
                        applyFiltersAndRender();
                        if (dataSourceBadge) {
                            dataSourceBadge.textContent = '📭 No data (Supabase)';
                            dataSourceBadge.style.background = 'rgba(255,193,7,0.2)';
                            dataSourceBadge.style.color = '#ffc107';
                        }
                        updateAdminStats();
                        if (loadingOverlay) loadingOverlay.classList.remove('active');
                        return;
                    }

                    currentBatchId = batchId;

                    // ----- PAGINATION TO FETCH ALL ROWS -----
                    const PAGE_SIZE = 1000;
                    let allRows = [];
                    let start = 0;
                    let hasMore = true;

                    while (hasMore) {
                        const { data: rows, error: dataError } = await supabaseClient
                            .from('inventory_items')
                            .select('data')
                            .eq('batch_id', batchId)
                            .range(start, start + PAGE_SIZE - 1);

                        if (dataError) throw dataError;

                        if (rows && rows.length > 0) {
                            allRows = allRows.concat(rows);
                            start += rows.length;
                            if (rows.length < PAGE_SIZE) {
                                hasMore = false;
                            }
                        } else {
                            hasMore = false;
                        }
                    }

                    if (allRows.length > 0) {
                        allData = allRows.map(r => r.data);
                        isDataLoaded = true;
                        showToast(`Loaded ${allData.length} records from Supabase`, 'success', 3000);
                    } else {
                        allData = [];
                        isDataLoaded = false;
                        showToast('No data found in Supabase', 'warning', 3000);
                    }

                    // Get last updated info
                    const { data: updatedData, error: updatedError } = await supabaseClient
                        .from('app_state')
                        .select('value')
                        .eq('key', 'last_updated')
                        .maybeSingle();

                    if (!updatedError && updatedData) {
                        localStorage.setItem('last_updated', updatedData.value);
                    }

                    if (dataSourceBadge) {
                        dataSourceBadge.textContent = `☁️ Supabase (${allData.length} records)`;
                        dataSourceBadge.style.background = 'rgba(59,158,255,0.2)';
                        dataSourceBadge.style.color = '#8abfff';
                    }

                    applyFiltersAndRender();
                    updateAdminStats();

                    const storedKeys = loadHighlights();
                    if (storedKeys && storedKeys.length > 0) {
                        applyStoredHighlights(storedKeys);
                    }

                } catch (err) {
                    console.error('loadDataFromSupabase error:', err);
                    showToast('Error loading data from Supabase: ' + err.message, 'error', 4000);
                    allData = [];
                    isDataLoaded = false;
                    applyFiltersAndRender();
                    if (dataSourceBadge) {
                        dataSourceBadge.textContent = '❌ Error loading';
                        dataSourceBadge.style.background = 'rgba(220,53,69,0.2)';
                        dataSourceBadge.style.color = '#dc3545';
                    }
                } finally {
                    if (loadingOverlay) loadingOverlay.classList.remove('active');
                }
            }

            async function importDataToSupabase(dataRows, fileName) {
                if (!supabaseClient) {
                    showToast('Supabase not configured. Cannot import.', 'error', 4000);
                    return false;
                }
                if (!isAdmin) {
                    showToast('Unauthorized. Admin access required.', 'error', 4000);
                    return false;
                }

                try {
                    if (loadingOverlay) loadingOverlay.classList.add('active');
                    if (adminStatusMsg) {
                        adminStatusMsg.textContent = '⏳ Importing data…';
                        adminStatusMsg.className = 'admin-status-msg info';
                    }

                    const newBatchId = 'batch_' + Date.now();

                    const items = dataRows.map(row => ({
                        batch_id: newBatchId,
                        data: row
                    }));

                    const chunkSize = 500;
                    let insertedCount = 0;
                    for (let i = 0; i < items.length; i += chunkSize) {
                        const chunk = items.slice(i, i + chunkSize);
                        const { error: insertError } = await supabaseClient
                            .from('inventory_items')
                            .insert(chunk);
                        if (insertError) throw insertError;
                        insertedCount += chunk.length;
                        if (adminStatusMsg) {
                            adminStatusMsg.textContent = `⏳ Importing… ${insertedCount}/${items.length} rows`;
                        }
                    }

                    const { error: batchUpdateError } = await supabaseClient
                        .from('app_state')
                        .upsert([
                            { key: 'current_batch_id', value: newBatchId },
                            { key: 'last_updated', value: new Date().toISOString() },
                            { key: 'file_name', value: fileName || 'Unknown' },
                            { key: 'record_count', value: String(items.length) }
                        ], { onConflict: 'key' });

                    if (batchUpdateError) throw batchUpdateError;

                    if (currentBatchId) {
                        const { error: deleteError } = await supabaseClient
                            .from('inventory_items')
                            .delete()
                            .eq('batch_id', currentBatchId);
                        if (deleteError) {
                            console.warn('Error deleting old batch:', deleteError);
                        }
                    }

                    currentBatchId = newBatchId;
                    await loadDataFromSupabase();

                    if (adminStatusMsg) {
                        adminStatusMsg.textContent = `✅ Successfully imported ${items.length} records from "${fileName || 'file'}"`;
                        adminStatusMsg.className = 'admin-status-msg success';
                    }
                    showToast(`✅ Imported ${items.length} records successfully`, 'success', 4000);
                    updateAdminStats();

                    return true;

                } catch (err) {
                    console.error('Import error:', err);
                    if (adminStatusMsg) {
                        adminStatusMsg.textContent = `❌ Import failed: ${err.message}`;
                        adminStatusMsg.className = 'admin-status-msg error';
                    }
                    showToast('Import failed: ' + err.message, 'error', 4000);
                    return false;
                } finally {
                    if (loadingOverlay) loadingOverlay.classList.remove('active');
                }
            }

            // ============================================================
            //  ADMIN STATS
            // ============================================================
            function updateAdminStats() {
                if (adminRecordCount) adminRecordCount.textContent = allData.length;
                if (adminLastUpdated) {
                    const lastUpdated = localStorage.getItem('last_updated');
                    if (lastUpdated) {
                        adminLastUpdated.textContent = formatDateForDisplay(lastUpdated);
                    } else {
                        adminLastUpdated.textContent = '—';
                    }
                }
                if (adminFileName) {
                    const fileName = localStorage.getItem('file_name') || 'inventory_data.xlsx';
                    adminFileName.textContent = allData.length > 0 ? fileName : '—';
                }
                if (recordBadge) recordBadge.textContent = allData.length + ' records';
            }

            // ============================================================
            //  FILTERS AND RENDER
            // ============================================================
            function applyFiltersAndRender() {
                const term = searchInput ? searchInput.value : '';
                searchTerm = term;

                let result = allData.filter(row => matchesSearch(row, term));
                result = result.filter(row => matchesFilters(row));

                if (showHighlightedOnly) {
                    result = result.filter(row => highlightedRows.has(row));
                }

                if (sortKey) {
                    const key = sortKey;
                    const dir = sortDir === 'asc' ? 1 : -1;
                    result.sort((a, b) => {
                        const va = a[key] !== undefined ? a[key] : '';
                        const vb = b[key] !== undefined ? b[key] : '';
                        if (['Boxes', 'Total Items', 'Valuation', 'Carton CBM', 'Box Rate'].includes(key)) {
                            return (parseNumber(va) - parseNumber(vb)) * dir;
                        }
                        if (key.includes('Date')) {
                            const da = parseDate(va);
                            const db = parseDate(vb);
                            if (da && db) return (da.getTime() - db.getTime()) * dir;
                            if (da) return -1 * dir;
                            if (db) return 1 * dir;
                            return String(va).localeCompare(String(vb)) * dir;
                        }
                        return String(va).localeCompare(String(vb)) * dir;
                    });
                }

                filteredData = result;
                updateSummary();
                renderTable();
                updateHighlightButton();
                updateAdminStats();
            }

            function updateSummary() {
                const total = filteredData.length;
                let boxes = 0;
                filteredData.forEach(row => {
                    boxes += parseNumber(row['Boxes']);
                });
                if (sumRecords) sumRecords.textContent = total;
                if (sumBoxes) sumBoxes.textContent = boxes.toLocaleString();
                if (recordBadge) recordBadge.textContent = allData.length + ' records';
            }

            function renderTable() {
                const total = filteredData.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, total);
                const pageData = filteredData.slice(start, end);

                // Header
                const headerRow = document.createElement('tr');
                DISPLAY_COLUMNS.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = HEADER_LABELS[col] || col;
                    th.dataset.col = col;
                    const icon = document.createElement('span');
                    icon.className = 'sort-icon';
                    icon.innerHTML =
                        '<svg viewBox="0 0 24 24" style="width:0.8rem;height:0.8rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polyline points="6 9 12 15 18 9"/></svg>';
                    th.appendChild(icon);
                    th.addEventListener('click', function() {
                        const key = this.dataset.col;
                        if (sortKey === key) {
                            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                        } else {
                            sortKey = key;
                            sortDir = 'asc';
                        }
                        document.querySelectorAll('#tableHead th').forEach(h => {
                            h.classList.remove('sorted-asc', 'sorted-desc');
                        });
                        this.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                        applyFiltersAndRender();
                    });
                    headerRow.appendChild(th);
                });
                if (tableHead) {
                    tableHead.innerHTML = '';
                    tableHead.appendChild(headerRow);
                }

                document.querySelectorAll('#tableHead th').forEach(th => {
                    th.classList.remove('sorted-asc', 'sorted-desc');
                    if (th.dataset.col === sortKey) {
                        th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                    }
                });

                const highlightedBoxes = filteredData
                    .filter(row => highlightedRows.has(row))
                    .reduce((sum, row) => sum + parseNumber(row['Boxes']), 0);

                if (pageData.length === 0) {
                    if (tableBody) {
                        tableBody.innerHTML =
                            `<tr><td colspan="${DISPLAY_COLUMNS.length}" class="empty-state">
                                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                <p>${allData.length === 0 ? 'No data loaded — import a file to begin.' : 'No matching records'}</p>
                            </td></tr>`;
                    }
                } else {
                    let html = '';
                    pageData.forEach((row, index) => {
                        const isHighlighted = highlightedRows.has(row);
                        html += `<tr data-rowid="${index}" class="${isHighlighted ? 'highlighted' : ''}">`;
                        DISPLAY_COLUMNS.forEach(col => {
                            let val = row[col] !== undefined && row[col] !== null ? row[col] : '';
                            // For date columns, use formatShortDate (which handles strings)
                            if (col === 'Placement Date' || col === 'Received Date') {
                                val = formatShortDate(val);
                            }
                            html += `<td>${String(val)}</td>`;
                        });
                        html += '</tr>';
                    });

                    const showTotalRow = highlightedBoxes > 0;
                    html += `<tr class="total-highlight-row ${showTotalRow ? '' : 'hidden'}">`;
                    DISPLAY_COLUMNS.forEach((col, idx) => {
                        if (idx === 0) {
                            html += `<td><strong>Total</strong></td>`;
                        } else if (idx === 2) {
                            html += `<td><strong>${highlightedBoxes.toLocaleString()}</strong></td>`;
                        } else {
                            html += `<td></td>`;
                        }
                    });
                    html += '</tr>';

                    if (tableBody) {
                        tableBody.innerHTML = html;
                        const rows = tableBody.querySelectorAll('tr:not(.total-highlight-row)');
                        rows.forEach((tr, idx) => {
                            tr.addEventListener('click', function() {
                                const row = pageData[idx];
                                if (!row) return;
                                if (highlightedRows.has(row)) {
                                    highlightedRows.delete(row);
                                    this.classList.remove('highlighted');
                                } else {
                                    highlightedRows.add(row);
                                    this.classList.add('highlighted');
                                    this.classList.add('row-clicked');
                                    setTimeout(() => this.classList.remove('row-clicked'), 300);
                                }
                                saveHighlights();
                                if (showHighlightedOnly) {
                                    applyFiltersAndRender();
                                } else {
                                    renderTable();
                                    updateHighlightButton();
                                }
                            });
                        });
                    }
                }

                if (paginationInfo) {
                    paginationInfo.textContent = total === 0 ?
                        'Showing 0–0 of 0' :
                        `Showing ${start+1}–${end} of ${total}`;
                }
                if (pageNumbers) pageNumbers.textContent = `${currentPage} / ${totalPages}`;
                if (pagePrev) pagePrev.disabled = currentPage <= 1;
                if (pageNext) pageNext.disabled = currentPage >= totalPages;
            }

            // ============================================================
            //  HIGHLIGHT CONTROLS
            // ============================================================
            function updateHighlightButton() {
                const count = highlightedRows.size;
                if (highlightBtnText) {
                    highlightBtnText.textContent = `Highlighted${count ? ` (${count})` : ''}`;
                }
                if (highlightToggleBtn) {
                    if (showHighlightedOnly) {
                        highlightToggleBtn.classList.add('active');
                    } else {
                        highlightToggleBtn.classList.remove('active');
                    }
                }
            }

            function toggleHighlightFilter() {
                showHighlightedOnly = !showHighlightedOnly;
                currentPage = 1;
                applyFiltersAndRender();
                showToast(showHighlightedOnly ? 'Showing only highlighted rows' : 'Showing all rows', 'info', 1500);
            }

            function clearHighlights() {
                highlightedRows.clear();
                showHighlightedOnly = false;
                localStorage.removeItem('warehouse_highlights');
                currentPage = 1;
                applyFiltersAndRender();
                showToast('All highlights cleared', 'warning', 2000);
            }

            // ============================================================
            //  RESET
            // ============================================================
            function clearFilterInputs() {
                if (filterLocation) filterLocation.value = '';
                if (filterModel) filterModel.value = '';
                if (filterPlacedBy) filterPlacedBy.value = '';
                if (filterPallet) filterPallet.value = '';
                if (filterPlaceFrom) filterPlaceFrom.value = '';
                if (filterPlaceTo) filterPlaceTo.value = '';
                if (filterBoxMin) filterBoxMin.value = '';
                if (filterBoxMax) filterBoxMax.value = '';
            }

            function resetAll() {
                clearFilterInputs();
                if (searchInput) searchInput.value = '';
                searchTerm = '';
                sortKey = null;
                sortDir = 'asc';
                highlightedRows.clear();
                showHighlightedOnly = false;
                localStorage.removeItem('warehouse_highlights');
                currentPage = 1;
                applyFiltersAndRender();
                showToast('All settings reset', 'success', 2000);
            }

            // ============================================================
            //  DELETE DATA
            // ============================================================
            async function deleteAllData() {
                if (!isAdmin) {
                    showToast('Unauthorized. Admin access required.', 'error', 3000);
                    return;
                }
                if (allData.length === 0 && highlightedRows.size === 0) {
                    showToast('No data to delete', 'warning', 2000);
                    return;
                }
                const confirmed = confirm(
                    '⚠️ DELETE ALL DATA?\n\nThis will permanently remove all inventory data from Supabase. This cannot be undone.\n\nAre you sure?'
                );
                if (!confirmed) return;
                try {
                    if (loadingOverlay) loadingOverlay.classList.add('active');
                    if (currentBatchId) {
                        const { error } = await supabaseClient
                            .from('inventory_items')
                            .delete()
                            .eq('batch_id', currentBatchId);
                        if (error) throw error;
                    }
                    await supabaseClient
                        .from('app_state')
                        .upsert([
                            { key: 'current_batch_id', value: null },
                            { key: 'last_updated', value: null },
                            { key: 'file_name', value: null },
                            { key: 'record_count', value: '0' }
                        ], { onConflict: 'key' });
                    localStorage.removeItem('warehouse_highlights');
                    localStorage.removeItem('last_updated');
                    localStorage.removeItem('file_name');
                    allData = [];
                    filteredData = [];
                    highlightedRows.clear();
                    showHighlightedOnly = false;
                    sortKey = null;
                    sortDir = 'asc';
                    if (searchInput) searchInput.value = '';
                    searchTerm = '';
                    clearFilterInputs();
                    currentPage = 1;
                    currentBatchId = null;
                    isDataLoaded = false;
                    applyFiltersAndRender();
                    updateAdminStats();
                    if (dataSourceBadge) {
                        dataSourceBadge.textContent = '📭 Data deleted';
                        dataSourceBadge.style.background = 'rgba(220,53,69,0.2)';
                        dataSourceBadge.style.color = '#dc3545';
                    }
                    showToast('All data deleted successfully', 'success', 3000);
                } catch (err) {
                    showToast('Error deleting data: ' + err.message, 'error', 4000);
                } finally {
                    if (loadingOverlay) loadingOverlay.classList.remove('active');
                }
            }

            // ============================================================
            //  EXPORT
            // ============================================================
            function exportData(format) {
                let dataToExport = filteredData;
                let isHighlightedExport = false;
                if (format === 'excel-highlighted' || format === 'csv-highlighted') {
                    dataToExport = filteredData.filter(row => highlightedRows.has(row));
                    isHighlightedExport = true;
                    if (dataToExport.length === 0) {
                        showToast('No highlighted rows to export', 'warning', 2000);
                        return;
                    }
                }
                if (dataToExport.length === 0) {
                    showToast('No data to export', 'warning', 2000);
                    return;
                }
                const rows = dataToExport.map(row => {
                    const obj = {};
                    DISPLAY_COLUMNS.forEach(col => {
                        let val = row[col] !== undefined ? row[col] : '';
                        if (col === 'Placement Date' || col === 'Received Date') {
                            val = formatShortDate(val);
                        }
                        const label = HEADER_LABELS[col] || col;
                        obj[label] = val;
                    });
                    return obj;
                });
                const totalBoxes = dataToExport.reduce((sum, row) => sum + parseNumber(row['Boxes']), 0);
                const isPrint = format === 'print';
                if (!isPrint) {
                    const totalRow = {};
                    DISPLAY_COLUMNS.forEach(col => {
                        const label = HEADER_LABELS[col] || col;
                        if (col === 'Boxes') {
                            totalRow[label] = totalBoxes;
                        } else {
                            totalRow[label] = '';
                        }
                    });
                    const firstLabel = HEADER_LABELS[DISPLAY_COLUMNS[0]] || DISPLAY_COLUMNS[0];
                    totalRow[firstLabel] = 'TOTAL';
                    rows.push(totalRow);
                }
                if (isPrint) {
                    const win = window.open('', '_blank');
                    if (!win) { showToast('Please allow popups for printing.', 'error', 3000); return; }
                    let html = '<html><head><title>Warehouse Inventory</title><style>' +
                        'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12px;padding:20px;}' +
                        'table{width:100%;border-collapse:collapse;font-size:11px;}' +
                        'th,td{border:1px solid #ccc;padding:6px 10px;text-align:left;}' +
                        'th{background:#0b1a2e;color:#fff;}' +
                        'h2{margin-bottom:4px;}' +
                        '.footer{margin-top:20px;padding-top:10px;border-top:1px solid #ddd;text-align:center;font-size:10px;color:#888;}' +
                        '.total-row td{font-weight:bold;background:#f0f4f9;}' +
                        '</style></head><body>';
                    html += `<h2>Warehouse Inventory — ${new Date().toLocaleString()}</h2>`;
                    html += `<p>${dataToExport.length} records</p>`;
                    if (isHighlightedExport) html += `<p><em>Exporting highlighted rows only</em></p>`;
                    const headers = DISPLAY_COLUMNS.map(col => HEADER_LABELS[col] || col);
                    html +=
                        `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
                    dataToExport.forEach(row => {
                        html += '<tr>' + DISPLAY_COLUMNS.map(c => {
                            let val = row[c] || '';
                            if (c === 'Placement Date' || c === 'Received Date') {
                                val = formatShortDate(val);
                            }
                            return `<td>${String(val)}</td>`;
                        }).join('') + '</tr>';
                    });
                    html += '<tr class="total-row">';
                    DISPLAY_COLUMNS.forEach((col, idx) => {
                        if (idx === 0) {
                            html += `<td><strong>TOTAL</strong></td>`;
                        } else if (col === 'Boxes') {
                            html += `<td><strong>${totalBoxes.toLocaleString()}</strong></td>`;
                        } else {
                            html += `<td></td>`;
                        }
                    });
                    html += '</tr>';
                    html += '</tbody></table>';
                    html +=
                        `<div class="footer">Developed with ❤️ by <strong>Aoun Ahmed</strong> · Warehouse Inventory</div>`;
                    html += '</body></html>';
                    win.document.write(html);
                    win.document.close();
                    setTimeout(() => { win.print(); }, 300);
                    return;
                }
                const actualFormat = (format === 'excel-highlighted' || format === 'excel') ? 'xlsx' : 'csv';
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
                const wbout = XLSX.write(wb, { bookType: actualFormat, type: 'array' });
                const blob = new Blob([wbout], { type: actualFormat === 'csv' ? 'text/csv' :
                        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                let filename = `inventory_export.${actualFormat === 'csv' ? 'csv' : 'xlsx'}`;
                if (isHighlightedExport) filename = `highlighted_${filename}`;
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`Exported ${dataToExport.length} rows`, 'success', 2000);
            }

            // ============================================================
            //  UPPERCASE ENFORCEMENT
            // ============================================================
            function enforceUppercase(e) {
                const input = e.target;
                if (input.type === 'text') {
                    const val = input.value;
                    const upper = val.toUpperCase();
                    if (val !== upper) {
                        input.value = upper;
                    }
                }
            }

            // ============================================================
            //  DEBOUNCE
            // ============================================================
            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), ms);
                };
            }

            // ============================================================
            //  ADMIN FILE IMPORT HANDLER (with cellDates: false)
            // ============================================================
            function handleAdminFileImport(file) {
                if (!isAdmin) {
                    showToast('Unauthorized. Admin access required.', 'error', 3000);
                    return;
                }
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        if (adminStatusMsg) {
                            adminStatusMsg.textContent = '⏳ Reading file…';
                            adminStatusMsg.className = 'admin-status-msg info';
                        }
                        const data = new Uint8Array(e.target.result);
                        // CRITICAL: cellDates: false to keep dates as serial numbers
                        const workbook = XLSX.read(data, { type: 'array', cellDates: false });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

                        if (!json || json.length === 0) {
                            if (adminStatusMsg) {
                                adminStatusMsg.textContent = '❌ No data found in file.';
                                adminStatusMsg.className = 'admin-status-msg error';
                            }
                            showToast('No data found in file.', 'error', 3000);
                            return;
                        }

                        // Build rows with date conversion
                        const newData = json.map(row => buildRowFromExcel(row));

                        const criticalCols = ['Location', 'Model Number', 'Boxes', 'Pallet Serial'];
                        const missingCritical = criticalCols.filter(col => {
                            return newData.every(r => r[col] === '' || r[col] === undefined || r[col] === null);
                        });
                        if (missingCritical.length > 0) {
                            if (adminStatusMsg) {
                                adminStatusMsg.textContent =
                                    `⚠️ Some critical columns appear empty: ${missingCritical.join(', ')}. Please check the file.`;
                                adminStatusMsg.className = 'admin-status-msg error';
                            }
                            showToast('File may be missing required columns. Check the status message.', 'warning', 4000);
                        }

                        const fileName = file.name || 'Unknown';
                        const success = await importDataToSupabase(newData, fileName);
                        if (success) {
                            if (adminFileInput) adminFileInput.value = '';
                        }
                    } catch (err) {
                        if (adminStatusMsg) {
                            adminStatusMsg.textContent = `❌ Error: ${err.message}`;
                            adminStatusMsg.className = 'admin-status-msg error';
                        }
                        showToast('Error reading file: ' + err.message, 'error', 4000);
                    }
                };
                reader.onerror = function() {
                    if (adminStatusMsg) {
                        adminStatusMsg.textContent = '❌ Failed to read file.';
                        adminStatusMsg.className = 'admin-status-msg error';
                    }
                    showToast('Failed to read file.', 'error', 3000);
                };
                reader.readAsArrayBuffer(file);
            }

            // ============================================================
            //  INDEXEDDB HELPERS (fallback)
            // ============================================================
            const DB_NAME = 'WarehouseInventoryDB';
            const STORE_NAME = 'inventoryData';
            const DB_VERSION = 1;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (event) => resolve(event.target.result);
                    request.onerror = (event) => reject(event.target.error);
                });
            }

            async function loadDataFromDB() {
                try {
                    const db = await openDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const request = store.get('mainData');
                        request.onsuccess = () => resolve(request.result ? request.result.data : null);
                        request.onerror = () => reject(request.error);
                    });
                } catch (err) {
                    console.error('loadDataFromDB error:', err);
                    return null;
                }
            }

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                supabaseClient = initSupabase();

                // Uppercase
                const textInputs = [
                    searchInput,
                    filterLocation,
                    filterModel,
                    filterPlacedBy,
                    filterPallet
                ];
                textInputs.forEach(inp => {
                    if (inp) {
                        inp.addEventListener('input', enforceUppercase);
                    }
                });

                // Admin Login
                if (adminBtn) {
                    adminBtn.addEventListener('click', function() {
                        if (isAdmin) {
                            if (adminPanelContainer) {
                                adminPanelContainer.style.display = 'block';
                            }
                            updateAdminStats();
                            return;
                        }
                        if (loginModal) loginModal.classList.add('active');
                        if (loginEmail) loginEmail.value = '';
                        if (loginPassword) loginPassword.value = '';
                        if (loginError) loginError.classList.remove('visible');
                        if (loginStatus) {
                            loginStatus.innerHTML = '<strong>ℹ️</strong> Enter your admin credentials to access the Admin Panel.';
                        }
                    });
                }

                if (loginModalClose) {
                    loginModalClose.addEventListener('click', function() {
                        if (loginModal) loginModal.classList.remove('active');
                    });
                }

                if (loginModal) {
                    loginModal.addEventListener('click', function(e) {
                        if (e.target === this) {
                            loginModal.classList.remove('active');
                        }
                    });
                }

                if (loginBtn) {
                    loginBtn.addEventListener('click', async function() {
                        const email = loginEmail ? loginEmail.value.trim() : '';
                        const password = loginPassword ? loginPassword.value : '';
                        if (!email || !password) {
                            if (loginError) {
                                loginError.textContent = 'Please enter both email and password.';
                                loginError.classList.add('visible');
                            }
                            return;
                        }
                        await loginAdmin(email, password);
                    });
                }

                if (loginEmail) {
                    loginEmail.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && loginBtn) loginBtn.click();
                    });
                }
                if (loginPassword) {
                    loginPassword.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && loginBtn) loginBtn.click();
                    });
                }

                if (adminLogoutBtn) {
                    adminLogoutBtn.addEventListener('click', logoutAdmin);
                }

                // Admin File Import
                if (adminFileInput) {
                    adminFileInput.addEventListener('change', function(e) {
                        if (this.files && this.files[0]) {
                            if (adminStatusMsg) {
                                adminStatusMsg.textContent = `📄 Selected: ${this.files[0].name} (${(this.files[0].size / 1024).toFixed(1)} KB)`;
                                adminStatusMsg.className = 'admin-status-msg info';
                            }
                        }
                    });
                }

                if (adminImportBtn) {
                    adminImportBtn.addEventListener('click', function() {
                        if (!isAdmin) {
                            showToast('Unauthorized. Admin access required.', 'error', 3000);
                            return;
                        }
                        if (!adminFileInput || !adminFileInput.files || !adminFileInput.files[0]) {
                            if (adminStatusMsg) {
                                adminStatusMsg.textContent = '⚠️ Please select an Excel file first.';
                                adminStatusMsg.className = 'admin-status-msg error';
                            }
                            return;
                        }
                        handleAdminFileImport(adminFileInput.files[0]);
                    });
                }

                if (adminRefreshBtn) {
                    adminRefreshBtn.addEventListener('click', async function() {
                        await loadDataFromSupabase();
                        showToast('Data refreshed', 'info', 2000);
                    });
                }

                // Legacy import (hidden for non-admins)
                if (importBtn) {
                    importBtn.addEventListener('click', function() {
                        if (!isAdmin) {
                            showToast('Unauthorized. Admin access required.', 'error', 3000);
                            return;
                        }
                        if (fileInput) fileInput.click();
                    });
                }

                if (fileInput) {
                    fileInput.addEventListener('change', function(e) {
                        if (!isAdmin) {
                            this.value = '';
                            showToast('Unauthorized. Admin access required.', 'error', 3000);
                            return;
                        }
                        if (this.files && this.files[0]) {
                            handleAdminFileImport(this.files[0]);
                        }
                        this.value = '';
                    });
                }

                // Search
                if (searchInput) {
                    searchInput.addEventListener('input', debounce(applyFiltersAndRender, 200));
                }

                // Filters
                const filterInputs = [
                    filterLocation, filterModel, filterPlacedBy, filterPallet,
                    filterPlaceFrom, filterPlaceTo, filterBoxMin, filterBoxMax
                ];
                filterInputs.forEach(inp => {
                    if (inp) {
                        inp.addEventListener('input', debounce(applyFiltersAndRender, 150));
                        inp.addEventListener('change', applyFiltersAndRender);
                    }
                });

                // Toggle Filters
                let filtersVisible = true;
                if (toggleFiltersBtn) {
                    toggleFiltersBtn.addEventListener('click', function() {
                        filtersVisible = !filtersVisible;
                        if (filtersSection) {
                            filtersSection.classList.toggle('collapsed', !filtersVisible);
                        }
                    });
                }

                // Reset All
                if (resetAllBtn) {
                    resetAllBtn.addEventListener('click', resetAll);
                }

                // Delete Data
                if (deleteDataBtn) {
                    deleteDataBtn.addEventListener('click', deleteAllData);
                }

                // Highlight controls
                if (highlightToggleBtn) {
                    highlightToggleBtn.addEventListener('click', toggleHighlightFilter);
                }
                if (clearHighlightsBtn) {
                    clearHighlightsBtn.addEventListener('click', clearHighlights);
                }

                // Pagination
                if (pagePrev) {
                    pagePrev.addEventListener('click', function() {
                        if (currentPage > 1) { currentPage--;
                            renderTable(); }
                    });
                }
                if (pageNext) {
                    pageNext.addEventListener('click', function() {
                        const totalPages = Math.ceil(filteredData.length / pageSize);
                        if (currentPage < totalPages) { currentPage++;
                            renderTable(); }
                    });
                }
                if (pageSizeSelect) {
                    pageSizeSelect.addEventListener('change', function() {
                        pageSize = parseInt(this.value, 10);
                        currentPage = 1;
                        renderTable();
                    });
                }

                // Export
                if (exportBtn) {
                    exportBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (exportMenu) exportMenu.classList.toggle('show');
                    });
                }
                document.addEventListener('click', function() {
                    if (exportMenu) exportMenu.classList.remove('show');
                });
                if (exportMenu) {
                    exportMenu.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const format = this.dataset.format;
                            exportData(format);
                            if (exportMenu) exportMenu.classList.remove('show');
                        });
                    });
                }

                // Keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        if (searchInput) searchInput.focus();
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
                        e.preventDefault();
                        toggleHighlightFilter();
                    }
                    if (e.key === 'Escape') {
                        if (loginModal && loginModal.classList.contains('active')) {
                            loginModal.classList.remove('active');
                        }
                    }
                });

                // Auth and load
                await checkAuth();
                await loadDataFromSupabase();

                // Migrate from IndexedDB if needed
                if (allData.length === 0 && isAdmin) {
                    try {
                        const savedData = await loadDataFromDB();
                        if (savedData && Array.isArray(savedData) && savedData.length > 0) {
                            const migrate = confirm(
                                `Found ${savedData.length} records in local storage (IndexedDB). Would you like to import them to Supabase?`
                            );
                            if (migrate) {
                                await importDataToSupabase(savedData, 'migrated_from_local');
                            }
                        }
                    } catch (e) { /* ignore */ }
                }

                // Apply stored highlights
                if (allData.length > 0) {
                    const storedKeys = loadHighlights();
                    if (storedKeys && storedKeys.length > 0) {
                        applyStoredHighlights(storedKeys);
                    }
                }

                updateAdminStats();
                if (dataSourceBadge) {
                    dataSourceBadge.textContent = allData.length > 0 ?
                        `☁️ Supabase (${allData.length} records)` :
                        '📭 No data';
                    if (allData.length === 0) {
                        dataSourceBadge.style.background = 'rgba(255,193,7,0.2)';
                        dataSourceBadge.style.color = '#ffc107';
                    }
                }

                showToast('Welcome! Data loaded from Supabase.', 'info', 2000);
            }

            // ============================================================
            //  START
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 100);
            }

        })();
    </script>

</body>
</html>
