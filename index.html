<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Warehouse Inventory Search</title>

    <!-- ===== XLSX LIBRARY ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <script>
        if (typeof XLSX === 'undefined') {
            document.write('<script src="xlsx.full.min.js"><\/script>');
        }
        if (typeof XLSX === 'undefined') {
            alert('XLSX library not found.\n\nPlease either:\n1. Connect to the internet to load from CDN, OR\n2. Download xlsx.full.min.js from https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js and place it in the same folder.');
        }
    </script>

    <!-- ===== SUPABASE SDK ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js">
    </script>
    <script>
        if (typeof supabase === 'undefined') {
            console.warn('Supabase library not loaded via CDN. Loading dynamically...');
            document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"><\/script>');
        }
    </script>

    <style>
        /* ============================================================
               CSS – Mobile‑First, 100% Responsive
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0b1a2e;
            --accent: #3b9eff;
            --accent-light: #e8f1fe;
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --bg-header: #0b1a2e;
            --text-primary: #1a2634;
            --text-secondary: #4a5a6e;
            --text-muted: #8a9aa8;
            --border-color: #dce4ec;
            --radius: 12px;
            --radius-sm: 6px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --table-header-bg: #0b1a2e;
            --table-header-text: #ffffff;
            --table-row-hover: #eaf2fc;
            --table-stripe: #f8fafc;
            --highlight-bg: #fff3cd;
            --highlight-border: #ffc107;
            --yellow: #ffc107;
            --yellow-hover: #e0a800;
            --red: #dc3545;
            --red-hover: #c82333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.10);
            --touch-min: 44px;
            --toast-bg: #323232;
            --toast-color: #fff;
            --admin-gold: #f5a623;
            --admin-gold-dark: #c47d10;
        }
        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e8edf4;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8aa0b8;
        }
        .icon-svg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 1.2em;
            height: 1.2em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            padding: 0.6em 1.2em;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            font-family: var(--font);
            white-space: nowrap;
            text-decoration: none;
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow);
            min-height: var(--touch-min);
            min-width: var(--touch-min);
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 158, 255, 0.35);
        }
        .btn-primary:hover {
            background: #5aadff;
        }
        .btn-outline-light {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: none;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }
        .btn-danger:hover {
            background: var(--red-hover);
        }
        .btn-warning {
            background: var(--yellow);
            color: #212529;
            border: 1.5px solid var(--yellow);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.25);
        }
        .btn-warning:hover {
            background: var(--yellow-hover);
            border-color: var(--yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 193, 7, 0.35);
        }
        .btn-warning.active {
            background: var(--yellow-hover);
            border-color: #c69500;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.5);
        }
        .btn-secondary {
            background: #e9ecef;
            color: #212529;
            border: 1px solid #ced4da;
        }
        .btn-secondary:hover {
            background: #dee2e6;
        }
        .btn-admin {
            background: var(--admin-gold);
            color: #1a1a1a;
            border: 1px solid var(--admin-gold-dark);
            box-shadow: 0 2px 8px rgba(245, 166, 35, 0.3);
            font-weight: 700;
        }
        .btn-admin:hover {
            background: var(--admin-gold-dark);
            border-color: #a86510;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.4);
        }
        .btn-admin.logged-in {
            background: #28a745;
            border-color: #1e7e34;
            color: #fff;
        }
        .btn-admin.logged-in:hover {
            background: #1e7e34;
        }
        .btn-delete {
            background: #6c1a2a;
            color: #fff;
            border: 1px solid #8a2a3a;
            box-shadow: 0 2px 8px rgba(108, 26, 42, 0.3);
        }
        .btn-delete:hover {
            background: #8a2a3a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 26, 42, 0.4);
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 1;
            transition: 0s;
        }
        .app-header {
            background: var(--bg-header);
            color: #fff;
            padding: 0.8rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
            overflow: visible;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .header-left h1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 60%, #8abfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #b8d4ff;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            position: relative;
            overflow: visible;
        }
        .header-right .btn {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            min-height: 38px;
        }
        .export-dropdown {
            position: relative;
            display: inline-block;
            overflow: visible;
        }
        .export-menu {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            left: auto;
            background: #fff;
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.14);
            min-width: 200px;
            max-width: 90vw;
            padding: 0.3rem 0;
            z-index: 50;
            border: 1px solid var(--border-color);
            animation: slideDown 0.15s ease;
        }
        .export-menu.show {
            display: block;
        }
        .export-menu button {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
            padding: 0.6rem 1.2rem;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.2s ease;
            font-family: var(--font);
            min-height: 44px;
        }
        .export-menu button:hover {
            background: #f0f6fe;
            color: var(--accent);
        }
        .export-menu .danger-item {
            color: var(--red);
        }
        .export-menu .danger-item:hover {
            background: #fde8ea;
            color: var(--red-hover);
        }
        .export-menu hr {
            margin: 0.2rem 0.8rem;
            border: none;
            border-top: 1px solid var(--border-color);
        }
        .search-section {
            padding: 1rem 1rem 0.5rem 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }
        .search-wrapper {
            position: relative;
            max-width: 720px;
            margin: 0 auto;
        }
        .search-wrapper .icon-svg {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            pointer-events: none;
            width: 1.3rem;
            height: 1.3rem;
            transition: opacity 0.2s ease;
        }
        #searchInput {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 3rem;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            font-family: var(--font);
            color: var(--text-primary);
            outline: none;
            min-height: var(--touch-min);
        }
        #searchInput:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 158, 255, 0.25);
        }
        #searchInput::placeholder {
            color: var(--text-muted);
        }
        .search-hint {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-body);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.6;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        #searchInput:focus+.search-hint,
        #searchInput:not(:placeholder-shown)+.search-hint {
            opacity: 0;
        }
        .filters-section {
            padding: 0.6rem 1rem 1rem 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.3s ease;
            max-height: 1500px;
            overflow: hidden;
            opacity: 1;
        }
        .filters-section.collapsed {
            max-height: 0;
            padding: 0 1rem;
            opacity: 0;
            border-bottom: none;
        }
        .filters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .filter-group label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .filter-group input {
            padding: 0.5rem 0.8rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: var(--font);
            background: var(--bg-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            color: var(--text-primary);
            outline: none;
            width: 100%;
            min-height: var(--touch-min);
        }
        .filter-group input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 158, 255, 0.25);
        }
        .filter-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .filter-group input[type="date"] {
            min-height: var(--touch-min);
        }
        .filter-group input[type="number"] {
            min-height: var(--touch-min);
        }
        .summary-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            padding: 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }
        .summary-card {
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
            box-shadow: var(--shadow);
        }
        .summary-card:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .summary-card .icon-wrap {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: rgba(59, 158, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent);
        }
        .summary-card .icon-wrap .icon-svg {
            width: 1.2rem;
            height: 1.2rem;
        }
        .summary-card .info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .summary-card .info .label {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }
        .summary-card .info .value {
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .table-section {
            flex: 1;
            padding: 1rem 1rem 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .table-container {
            flex: 1;
            overflow: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: #fff;
            box-shadow: var(--shadow);
            min-height: 280px;
            -webkit-overflow-scrolling: touch;
        }
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: auto;
            min-width: 600px;
        }
        #resultTable thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #resultTable th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            font-weight: 600;
            padding: 0.7rem 0.8rem;
            text-align: left;
            border-bottom: 2px solid #1a2f4a;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease, color 0.2s ease;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            position: relative;
        }
        #resultTable th:hover {
            background: #1a2f4a;
            color: #fff;
        }
        #resultTable th .sort-icon {
            margin-left: 0.3rem;
            display: inline-flex;
            opacity: 0.4;
            width: 0.8rem;
            height: 0.8rem;
            vertical-align: middle;
            color: #8ab4ff;
            transition: transform 0.25s ease, opacity 0.2s ease;
        }
        #resultTable th.sorted-asc .sort-icon {
            opacity: 1;
            color: var(--accent);
        }
        #resultTable th.sorted-desc .sort-icon {
            opacity: 1;
            color: var(--accent);
            transform: rotate(180deg);
        }
        #resultTable td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #eef2f7;
            color: var(--text-primary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        #resultTable tbody tr:nth-child(even) {
            background: var(--table-stripe);
        }
        #resultTable tbody tr:hover {
            background: var(--table-row-hover);
        }
        #resultTable tbody tr.highlighted {
            background: var(--highlight-bg) !important;
            box-shadow: inset 4px 0 0 var(--highlight-border);
            animation: highlightFlash 0.4s ease;
        }
        @keyframes highlightFlash {
            0% {
                background: #ffe69b;
            }
            100% {
                background: var(--highlight-bg);
            }
        }
        #resultTable tbody tr.row-clicked {
            animation: rowRipple 0.3s ease;
        }
        @keyframes rowRipple {
            0% {
                transform: scale(0.98);
                background: #d4e3fd;
            }
            50% {
                transform: scale(1.01);
            }
            100% {
                transform: scale(1);
            }
        }
        #resultTable tbody tr.total-highlight-row {
            background: #fff8e1 !important;
            border-top: 2px solid var(--highlight-border);
            font-weight: 600;
            animation: fadeInUp 0.3s ease;
        }
        #resultTable tbody tr.total-highlight-row td {
            padding: 0.6rem 0.8rem;
            color: #856404;
            text-align: center;
        }
        #resultTable tbody tr.total-highlight-row td:first-child {
            text-align: left;
            font-weight: 600;
            color: #856404;
        }
        #resultTable tbody tr.total-highlight-row td:nth-child(3) {
            font-weight: 700;
        }
        #resultTable tbody tr.total-highlight-row.hidden {
            display: none;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon-svg {
            width: 3rem;
            height: 3rem;
            margin: 0 auto 0.5rem;
            opacity: 0.3;
            display: block;
            color: var(--text-muted);
        }
        .empty-state p {
            font-size: 0.9rem;
        }
        .table-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0 0 0;
            gap: 0.8rem;
        }
        .pagination-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .pagination-controls .page-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.1s ease;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--touch-min);
            min-width: var(--touch-min);
        }
        .pagination-controls .page-btn .icon-svg {
            width: 1rem;
            height: 1rem;
        }
        .pagination-controls .page-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f0f7ff;
            transform: scale(1.02);
        }
        .pagination-controls .page-btn:disabled {
            opacity: 0.3;
            cursor: default;
            transform: none;
        }
        .page-numbers {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0 0.5rem;
            color: var(--text-secondary);
            min-width: 3rem;
            text-align: center;
        }
        #pageSizeSelect {
            padding: 0.3rem 0.6rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            background: var(--bg-card);
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            font-family: var(--font);
            min-height: var(--touch-min);
            transition: border-color 0.2s ease;
        }
        #pageSizeSelect:focus {
            border-color: var(--accent);
        }
        .toast-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
            width: 90%;
            max-width: 500px;
        }
        .toast {
            background: var(--toast-bg);
            color: var(--toast-color);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            pointer-events: auto;
            animation: slideUpToast 0.3s ease forwards;
            width: 100%;
        }
        .toast.hide {
            animation: slideDownToast 0.3s ease forwards;
        }
        .toast.success {
            background: #28a745;
        }
        .toast.error {
            background: var(--red);
        }
        .toast.warning {
            background: var(--yellow);
            color: #212529;
        }
        .toast.info {
            background: var(--accent);
        }
        @keyframes slideUpToast {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes slideDownToast {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 500;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            max-width: 480px;
            width: 100%;
            padding: 2rem 1.8rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-box .modal-close {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s ease;
            padding: 0.3rem;
            line-height: 1;
        }
        .modal-box .modal-close:hover {
            color: var(--text-primary);
        }
        .modal-box h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }
        .modal-box .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }
        .modal-box .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font);
            background: var(--bg-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            min-height: var(--touch-min);
        }
        .modal-box .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 158, 255, 0.2);
        }
        .modal-box .btn-block {
            width: 100%;
            justify-content: center;
            margin-top: 0.5rem;
            min-height: var(--touch-min);
        }
        .modal-box .error-msg {
            color: var(--red);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .modal-box .error-msg.visible {
            display: block;
        }
        .modal-box .admin-status {
            background: #f0f7ff;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent);
        }
        .modal-box .admin-status strong {
            color: var(--text-primary);
        }
        .admin-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 1.8rem;
            margin: 0.5rem 1rem 0.5rem 1rem;
            box-shadow: var(--shadow);
        }
        .admin-panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--border-color);
        }
        .admin-panel-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .admin-panel-header h3 .badge-admin {
            background: var(--admin-gold);
            color: #1a1a1a;
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .admin-stat {
            background: #fff;
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .admin-stat .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }
        .admin-stat .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .admin-upload-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .admin-upload-area .file-input-wrapper {
            flex: 1;
            min-width: 180px;
        }
        .admin-upload-area .file-input-wrapper input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.5rem 0.6rem;
            border: 1.5px dashed var(--border-color);
            border-radius: var(--radius-sm);
            background: #fff;
            font-size: 0.8rem;
            font-family: var(--font);
            cursor: pointer;
            transition: border-color 0.2s ease;
            min-height: var(--touch-min);
        }
        .admin-upload-area .file-input-wrapper input[type="file"]:hover {
            border-color: var(--accent);
        }
        .admin-upload-area .file-input-wrapper input[type="file"]::file-selector-button {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-right: 0.6rem;
            min-height: 34px;
        }
        .admin-upload-area .file-input-wrapper input[type="file"]::file-selector-button:hover {
            background: #e2e8f0;
        }
        .admin-status-msg {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.6rem;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            background: #fff;
            border: 1px solid var(--border-color);
            min-height: 2.5rem;
        }
        .admin-status-msg.success {
            border-color: #28a745;
            background: #f0fff4;
            color: #155724;
        }
        .admin-status-msg.error {
            border-color: var(--red);
            background: #fdf0f0;
            color: #721c24;
        }
        .admin-status-msg.info {
            border-color: var(--accent);
            background: #f0f7ff;
            color: #004085;
        }
        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }
        .app-footer {
            background: var(--bg-header);
            color: #8ab4ff;
            padding: 1.2rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 0.8rem;
            letter-spacing: 0.02em;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .app-footer .heart {
            color: #ff6b6b;
            display: inline-block;
        }
        .app-footer .name {
            font-weight: 700;
            color: #fff;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 26, 46, 0.55);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-spinner {
            width: 3rem;
            height: 3rem;
            border: 5px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-header {
                padding: 0.6rem 0.8rem;
                gap: 0.6rem;
            }
            .header-left h1 {
                font-size: 1rem;
            }
            .badge {
                font-size: 0.6rem;
                padding: 0.1rem 0.6rem;
            }
            .header-right .btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
                min-height: 34px;
            }
            .header-right .btn span {
                display: none;
            }
            .header-right .btn .icon-svg {
                width: 1.2em;
                height: 1.2em;
            }
            .search-section {
                padding: 0.6rem 0.8rem 0.3rem 0.8rem;
            }
            #searchInput {
                font-size: 0.85rem;
                padding: 0.6rem 1rem 0.6rem 2.8rem;
                min-height: 38px;
            }
            .search-hint {
                display: none;
            }
            .filters-section {
                padding: 0.4rem 0.8rem 0.8rem 0.8rem;
            }
            .filters-grid {
                gap: 0.5rem;
            }
            .filter-group input {
                font-size: 0.8rem;
                min-height: 38px;
            }
            .summary-section {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
                padding: 0.6rem 0.8rem;
            }
            .summary-card {
                padding: 0.5rem 0.6rem;
                gap: 0.5rem;
            }
            .summary-card .icon-wrap {
                width: 2rem;
                height: 2rem;
            }
            .summary-card .icon-wrap .icon-svg {
                width: 1rem;
                height: 1rem;
            }
            .summary-card .info .value {
                font-size: 0.9rem;
            }
            .table-section {
                padding: 0.6rem 0.8rem 0.3rem 0.8rem;
            }
            #resultTable {
                font-size: 0.65rem;
                min-width: 500px;
            }
            #resultTable th,
            #resultTable td {
                padding: 0.4rem 0.5rem;
            }
            .table-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .pagination-controls {
                justify-content: center;
            }
            .pagination-controls .page-btn {
                padding: 0.3rem 0.6rem;
                min-height: 34px;
            }
            .toast-container {
                bottom: 1rem;
                width: 95%;
            }
            .toast {
                font-size: 0.8rem;
                padding: 0.6rem 1rem;
            }
            .app-footer {
                font-size: 0.75rem;
                padding: 1rem 0.8rem;
            }
            .export-menu {
                right: auto;
                left: 0;
                min-width: 160px;
                max-width: 85vw;
            }
            .modal-box {
                padding: 1.5rem 1.2rem;
            }
            .admin-panel {
                padding: 1rem 1rem;
                margin: 0.3rem 0.6rem;
            }
            .admin-stats {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 481px) {
            .filters-grid {
                gap: 0.8rem 1rem;
            }
            .summary-section {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            #resultTable {
                min-width: 100%;
            }
        }
        @media (min-width: 1025px) {
            .app-header {
                padding: 1rem 2rem;
            }
            .search-section,
            .filters-section,
            .summary-section,
            .table-section {
                padding-left: 2rem;
                padding-right: 2rem;
            }
            .filters-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem 1.2rem;
            }
            #resultTable {
                font-size: 0.8rem;
            }
            #resultTable th,
            #resultTable td {
                padding: 0.8rem 1rem;
            }
            .app-footer {
                padding: 1.5rem 2rem;
            }
            .admin-panel {
                margin: 0.5rem 2rem;
            }
        }
        @media (min-width: 1600px) {
            .app-header {
                padding: 1.2rem 3rem;
            }
            .search-section,
            .filters-section,
            .summary-section,
            .table-section {
                padding-left: 3rem;
                padding-right: 3rem;
            }
            .filters-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
            #resultTable {
                font-size: 0.9rem;
            }
            .app-footer {
                padding: 1.8rem 3rem;
            }
            .admin-panel {
                margin: 0.5rem 3rem;
            }
        }
        @media print {
            .app-header,
            .search-section,
            .filters-section,
            .summary-section,
            .table-footer,
            .app-footer,
            .export-dropdown,
            .btn,
            .page-btn,
            #pageSizeSelect,
            .toast-container,
            .modal-overlay,
            .admin-panel {
                display: none !important;
            }
            .table-section {
                padding: 0 !important;
            }
            .table-container {
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            #resultTable th {
                background: #000 !important;
                color: #fff !important;
            }
            #resultTable td {
                border-color: #ccc !important;
            }
            .total-highlight-row {
                background: #f0f0f0 !important;
                border-top: 2px solid #000 !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-left">
            <h1>Warehouse Inventory</h1>
            <span class="badge" id="recordBadge">0 records</span>
            <span class="badge" id="dataSourceBadge" style="background:rgba(59,158,255,0.2);color:#8abfff;">Loading…</span>
        </div>
        <div class="header-right">
            <button class="btn btn-admin" id="adminBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="adminBtnText">Admin</span>
            </button>
            <button class="btn btn-outline-light" id="toggleFiltersBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/></svg>
                <span>Filters</span>
            </button>
            <button class="btn btn-secondary" id="resetAllBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span>Reset</span>
            </button>
            <button class="btn btn-warning" id="highlightToggleBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span id="highlightBtnText">Highlighted</span>
            </button>
            <button class="btn btn-danger" id="clearHighlightsBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                <span>Clear</span>
            </button>
            <button class="btn btn-delete" id="deleteDataBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                <span>Delete</span>
            </button>
            <div class="export-dropdown">
                <button class="btn btn-outline-light" id="exportBtn">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Export</span>
                </button>
                <div class="export-menu" id="exportMenu">
                    <button data-format="excel">📊 Excel (.xlsx)</button>
                    <button data-format="csv">📄 CSV</button>
                    <button data-format="print">🖨️ Print</button>
                    <hr />
                    <button data-format="excel-highlighted">⭐ Highlighted (Excel)</button>
                    <button data-format="csv-highlighted">⭐ Highlighted (CSV)</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== ADMIN PANEL ===== -->
    <div id="adminPanelContainer" style="display:none;">
        <div class="admin-panel" id="adminPanel">
            <div class="admin-panel-header">
                <h3>
                    🔐 Admin Panel
                    <span class="badge-admin">Admin</span>
                </h3>
                <button class="btn btn-danger" id="adminLogoutBtn" style="min-height:36px;padding:0.3rem 1rem;font-size:0.75rem;">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width:1em;height:1em;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </button>
            </div>
            <div class="admin-stats">
                <div class="admin-stat">
                    <div class="stat-label">Current File</div>
                    <div class="stat-value" id="adminFileName">—</div>
                </div>
                <div class="admin-stat">
                    <div class="stat-label">Records</div>
                    <div class="stat-value" id="adminRecordCount">0</div>
                </div>
                <div class="admin-stat">
                    <div class="stat-label">Last Updated</div>
                    <div class="stat-value" id="adminLastUpdated">—</div>
                </div>
            </div>
            <div class="admin-upload-area">
                <div class="file-input-wrapper">
                    <input type="file" id="adminFileInput" accept=".xlsx,.xls,.csv" />
                </div>
                <button class="btn btn-primary" id="adminImportBtn" style="min-height:var(--touch-min);">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width:1em;height:1em;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import / Update Data
                </button>
            </div>
            <div class="admin-status-msg" id="adminStatusMsg">Status: Ready</div>
            <div class="admin-actions">
                <button class="btn btn-secondary" id="adminRefreshBtn" style="min-height:36px;font-size:0.75rem;">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width:1em;height:1em;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Refresh Data
                </button>
            </div>
        </div>
    </div>

    <!-- ===== SEARCH ===== -->
    <section class="search-section">
        <div class="search-wrapper">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search Model, Pallet, Location (use commas, spaces, or hyphens)" autocomplete="off" />
            <span class="search-hint">⌘K</span>
        </div>
    </section>

    <!-- ===== FILTERS ===== -->
    <section class="filters-section" id="filtersSection">
        <div class="filters-grid">
            <div class="filter-group">
                <label>Location</label>
                <input type="text" id="filterLocation" placeholder="e.g. A1, A1-A3" />
            </div>
            <div class="filter-group">
                <label>Model Number</label>
                <input type="text" id="filterModel" placeholder="e.g. UA0015 - UA0016" />
            </div>
            <div class="filter-group">
                <label>Placed By</label>
                <input type="text" id="filterPlacedBy" placeholder="Any" />
            </div>
            <div class="filter-group">
                <label>Pallet Serial</label>
                <input type="text" id="filterPallet" placeholder="Any" />
            </div>
            <div class="filter-group">
                <label>Placement From</label>
                <input type="date" id="filterPlaceFrom" />
            </div>
            <div class="filter-group">
                <label>Placement To</label>
                <input type="date" id="filterPlaceTo" />
            </div>
            <div class="filter-group">
                <label>Boxes Min</label>
                <input type="number" id="filterBoxMin" placeholder="0" min="0" />
            </div>
            <div class="filter-group">
                <label>Boxes Max</label>
                <input type="number" id="filterBoxMax" placeholder="∞" min="0" />
            </div>
        </div>
    </section>

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="summary-section" id="summarySection">

            // ============================================================
            //  DATE HELPERS (NO TIMEZONE, HANDLES ALL FORMATS)
            // ============================================================
            function excelSerialToDateString(serial) {
                // Convert Excel serial number (days since 1900-01-01) to YYYY-MM-DD
                const date = new Date(Date.UTC(1900, 0, serial - 1));
                const y = date.getUTCFullYear();
                const m = String(date.getUTCMonth() + 1).padStart(2, '0');
                const d = String(date.getUTCDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function formatShortDate(val) {
                if (!val) return '';
                // If it's already a plain YYYY-MM-DD string, return as is.
                if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
                    return val;
                }
                // If it's an ISO string with T (e.g., "2026-08-07T00:00:00.000Z")
                if (typeof val === 'string' && val.includes('T')) {
                    // Extract the date part (before T)
                    const datePart = val.split('T')[0];
                    // If that is a valid date, return it; otherwise fallback.
                    if (/^\d{4}-\d{2}-\d{2}$/.test(datePart)) {
                        return datePart;
                    }
                }
                // If it's a number (Excel serial), convert.
                if (typeof val === 'number' && val > 0 && val < 50000) {
                    return excelSerialToDateString(val);
                }
                // Otherwise try to parse as Date and convert to UTC string.
                let d = new Date(val);
                if (isNaN(d.getTime())) return String(val);
                const y = d.getUTCFullYear();
                const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                const day = String(d.getUTCDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            // For admin stats display (human readable)
            function formatDateForDisplay(val) {
                const str = formatShortDate(val);
                if (!str || str === '—') return '—';
                const parts = str.split('-');
                if (parts.length === 3) {
                    const d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
                    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
                }
                return str;
            }

            // ============================================================
            //  BUILD ROW FROM EXCEL (with date conversion)
            // ============================================================
            function buildRowFromExcel(row) {
                const obj = {};
                ALL_COLUMNS.forEach(col => {
                    let found = false;
                    const candidates = COLUMN_MAPPING[col] || [col];
                    for (const candidate of candidates) {
                        if (row[candidate] !== undefined) {
                            let value = row[candidate];
                            // Convert dates for specific columns
                            if (col === 'Placement Date' || col === 'Received Date') {
                                if (typeof value === 'number' && value > 0 && value < 50000) {
                                    value = excelSerialToDateString(value);
                                } else if (typeof value === 'string') {
                                    // If it's a string, try to parse and format to YYYY-MM-DD
                                    const d = new Date(value);
                                    if (!isNaN(d.getTime())) {
                                        value = formatShortDate(d);
                                    }
                                }
                            }
                            obj[col] = value;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        obj[col] = '';
                    }
                });
                return obj;
            }

            // ============================================================
            //  HELPERS
            // ============================================================
            function normalize(str) {
                if (str === undefined || str === null) return '';
                return String(str).trim().toLowerCase().replace(/\s+/g, ' ');
            }

            function parseNumber(v) {
                if (v === undefined || v === null || v === '') return 0;
                const n = parseFloat(String(v).replace(/,/g, ''));
                return isNaN(n) ? 0 : n;
            }

            function parseDate(v) {
                if (!v) return null;
                const d = new Date(v);
                return isNaN(d.getTime()) ? null : d;
            }

            function getHighlightKey(row) {
                return `${row['Pallet Serial'] || ''}_${row['Model Number'] || ''}`;
            }

            function parseLocationRange(input) {
                const trimmed = String(input).trim();
                if (!trimmed) return null;
                if (!trimmed.includes('-')) {
                    return [trimmed.toUpperCase()];
                }
                const parts = trimmed.split('-');
                if (parts.length !== 2) return [trimmed.toUpperCase()];
                const start = parts[0].trim().toUpperCase();
                const end = parts[1].trim().toUpperCase();
                const matchStart = start.match(/^([A-Z]+)(\d+)$/);
                const matchEnd = end.match(/^([A-Z]+)(\d+)$/);
                if (!matchStart || !matchEnd) {
                    return [start, end];
                }
                const prefixStart = matchStart[1];
                const numStart = parseInt(matchStart[2], 10);
                const prefixEnd = matchEnd[1];
                const numEnd = parseInt(matchEnd[2], 10);
                if (prefixStart !== prefixEnd) {
                    return [start, end];
                }
                const minNum = Math.min(numStart, numEnd);
                const maxNum = Math.max(numStart, numEnd);
                const results = [];
                for (let i = minNum; i <= maxNum; i++) {
                    results.push(prefixStart + i);
                }
                return results;
            }

            function locationMatches(locationVal, filterVal) {
                if (!filterVal) return true;
                const loc = normalize(locationVal);
                if (!loc) return false;
                const ranges = parseLocationRange(filterVal);
                if (!ranges) {
                    return loc.includes(normalize(filterVal));
                }
                const locUpper = loc.toUpperCase();
                for (const r of ranges) {
                    if (locUpper === r || locUpper.includes(r) || r.includes(locUpper)) {
                        return true;
                    }
                }
                return false;
            }

            function matchesSearch(row, term) {
                if (!term) return true;
                const raw = term.trim();
                if (!raw) return true;
                const terms = raw.split(/[,;]|\band\b|\s+|-/).filter(t => t.length > 0);
                if (terms.length === 0) return true;
                return terms.some(termPart => {
                    const lower = termPart.toLowerCase().trim();
                    if (!lower) return false;
                    const model = normalize(row['Model Number']);
                    const pallet = normalize(row['Pallet Serial']);
                    const location = normalize(row['Location']);
                    if (model === lower) return true;
                    if (model.startsWith(lower)) return true;
                    if (model.includes(lower)) return true;
                    if (pallet === lower) return true;
                    if (location.includes(lower)) return true;
                    return false;
                });
            }

            function matchesFilters(row) {
                if (!locationMatches(row['Location'], filterLocation.value)) return false;
                const mdl = normalize(filterModel.value);
                if (mdl && !normalize(row['Model Number']).includes(mdl)) return false;
                const pb = normalize(filterPlacedBy.value);
                if (pb && !normalize(row['Placed By']).includes(pb)) return false;
                const pallet = normalize(filterPallet.value);
                if (pallet && !normalize(row['Pallet Serial']).includes(pallet)) return false;
                const pFrom = filterPlaceFrom.value;
                if (pFrom) {
                    const d = parseDate(row['Placement Date']);
                    if (d && d < new Date(pFrom + 'T00:00:00')) return false;
                }
                const pTo = filterPlaceTo.value;
                if (pTo) {
                    const d = parseDate(row['Placement Date']);
                    if (d && d > new Date(pTo + 'T23:59:59')) return false;
                }
                const minBox = parseNumber(filterBoxMin.value);
                const maxBox = parseNumber(filterBoxMax.value);
                const boxes = parseNumber(row['Boxes']);
                if (minBox > 0 && boxes < minBox) return false;
                if (maxBox > 0 && boxes > maxBox) return false;
                return true;
            }

            function initSupabase() {
                let supabaseLib = null;
                if (typeof supabase !== 'undefined') {

                if (!supabaseLib) {
                    const globalKeys = Object.keys(window);
                    for (const key of globalKeys) {
                        if (key.toLowerCase().includes('supabase') && typeof window[key] === 'object' && window[key] !==
                            null) {
                            if (typeof window[key].createClient === 'function') {
                                supabaseLib = window[key];
